[project]
name = "alpaca-mcp"
version = "0.1.0"
description = "An MCP server exposing the Alpaca Trading and Market Data APIs as tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["mcp[cli]>=2.0.0"]

[project.scripts]
alpaca-mcp = "alpaca_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpaca_mcp"]
