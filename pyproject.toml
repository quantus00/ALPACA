[project]
name = "alpaca-mcp"
version = "0.1.0"
description = "An MCP server exposing the Alpaca Trading and Market Data APIs as tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["mcp[cli]>=2.0.0", "pytest>=8.0"]
# ICC trading bot broker SDKs (install only the venue you use):
coinbase = ["coinbase-advanced-py>=1.2"]
webull = ["webull>=0.6"]
web = ["coinbase-advanced-py>=1.2", "flask>=3.0"]

[project.scripts]
alpaca-mcp = "alpaca_mcp.server:main"
icc-bot = "icc_bot.runner:main"
icc-discover = "icc_bot.discover:main"
icc-backtest = "icc_bot.backtest:main"
icc-web = "icc_bot.webapp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpaca_mcp", "src/icc_bot"]
