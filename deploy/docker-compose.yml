# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env.saas
    volumes: [ "saas-data:/app/data" ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["python", "-m", "saas.engine"]
    env_file: ../.env.saas
    volumes: [ "saas-data:/app/data" ]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: [ "80:80", "443:443" ]
    environment:
      SAAS_DOMAIN: ${SAAS_DOMAIN:?set SAAS_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [ web ]
    restart: unless-stopped

volumes:
  saas-data:
  caddy-data:
  caddy-config:
